<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HA Village</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="village-card">
      <canvas id="village" width="960" height="540" aria-label="Petit village vivant vu du dessus"></canvas>

      <div class="topbar">
        <div class="status-block">
          <strong id="periodLabel">Nuit</strong>
          <span id="weatherLabel">Ensoleillé</span>
        </div>
        <div class="clock-block">
          <strong id="clock">00:00</strong>
          <span id="dateLabel">--</span>
        </div>
      </div>

      <div class="event-feed" id="eventFeed">
        <span class="event-dot"></span>
        <span id="eventText">Le village s’éveille...</span>
      </div>
    </section>

    <section class="tester" aria-label="Commandes de test">
      <div class="tester-group">
        <span class="tester-label">Heure</span>
        <button data-hour="7">Matin</button>
        <button data-hour="13">Jour</button>
        <button data-hour="19">Soir</button>
        <button data-hour="1">Nuit</button>
      </div>
      <div class="tester-group">
        <span class="tester-label">Météo</span>
        <button data-weather="sunny">Soleil</button>
        <button data-weather="cloudy">Nuageux</button>
        <button data-weather="rainy">Pluie</button>
        <button data-weather="stormy">Orage</button>
        <button data-weather="snowy">Neige</button>
        <button data-weather="foggy">Brouillard</button>
      </div>
      <div class="tester-group tester-actions">
        <button id="autoBtn" class="primary">Auto</button>
        <button id="chaosBtn">Événement</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
